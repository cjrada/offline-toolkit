# Build a kit from the hash-pinned manifest and publish it to Google Cloud Storage.
#   small         -> two jobs:
#                    `build`   builds the kit on a GitHub runner with NO cloud access (contents: read only,
#                              no id-token, no environment) and hands the zip on as a 1-day artifact;
#                    `publish` (gcs-publish environment, id-token) downloads that zip into a fresh
#                              directory, checks its sha256 against the build job's output, then
#                              authenticates and uploads. It installs and builds nothing.
#   medium/large  -> too big for a runner: `build` is skipped and `publish` submits the build to
#                    Cloud Build (cloudbuild.yaml, 600 GB disk).
#
# Safe for a PUBLIC repository:
#  * Runs only on a v* tag push or a manual run, and only on refs/heads/main or refs/tags/v*.
#    There are no pull_request / pull_request_target / issue triggers, so forks never reach it.
#  * Only the publish job uses the `gcs-publish` environment (required reviewer; deployment refs: main
#    and v* tags) and only it may request an OIDC token.
#  * No secrets. GitHub's OIDC token goes through Workload Identity Federation to impersonate the
#    kit-publisher service account. Google accepts it only for this repository id and name, main or v*
#    tags, and the gcs-publish environment (scripts/setup-gcp.sh).
#  * Every download is sha256- or git-commit-pinned (--frozen) and none of it is executed. Build-time
#    dependencies (poppler, libzim) run only in the build job, which cannot get Google credentials, so
#    nothing they leave on PATH, in $GITHUB_ENV or in the workspace reaches the job that can.
#  * Inputs reach the shell only through env and are validated against strict patterns
#    (tools/ci_inputs.sh); the publish job re-validates everything the build job hands it.
#  * Actions and container images are pinned to full SHAs/digests.
#
# Visibility: run-name puts tier, version and dry run / publish in the Actions run list; the job names
# say what each job does; every job writes a $GITHUB_STEP_SUMMARY section; and the `summary` job runs
# last with if: always() (no environment, no permissions, no checkout) to report the inputs, each job's
# result and the outcome in one place, including why jobs were skipped on refs other than main / v*.
name: publish-kit
# Tag pushes have no inputs: they always publish the small tier, versioned by the tag name. The default
# workflow_dispatch version (yyyymmdd-<commit>) cannot be computed here; the summary shows the resolved one.
run-name: "publish-kit · ${{ inputs.tier || 'small' }} · ${{ inputs.version || (github.event_name == 'push' && github.ref_name) || 'auto version' }} · ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'dry run' || 'publish' }}${{ (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')) && format(' · {0} (not main or v* tag, skipped)', github.ref_name) || '' }}"
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tier:
        description: "Kit tier"
        type: choice
        options: [small, medium, large]
        default: small
      version:
        description: "Version label (default: yyyymmdd-<commit>); letters, digits, . _ -"
        type: string
        default: ""
      dry_run:
        description: "Build and check, but do not upload"
        type: boolean
        default: true
permissions: {}
concurrency:
  group: publish-kit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # ---------------- small: build with no cloud access ----------------
  build:
    name: "build · small kit on a GitHub runner (no cloud access)"
    if: >-
      github.repository == 'cjrada/offline-toolkit' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name == 'push' || inputs.tier == 'small')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read  # nothing else: no id-token, no environment, no secrets or environment variables
    outputs:
      tier: ${{ steps.cfg.outputs.tier }}
      version: ${{ steps.cfg.outputs.version }}
      dry_run: ${{ steps.cfg.outputs.dry_run }}
      zip_name: ${{ steps.hash.outputs.zip_name }}
      sha256: ${{ steps.hash.outputs.sha256 }}
      size: ${{ steps.hash.outputs.size }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        id: cfg
        env:
          IN_TIER: ${{ inputs.tier }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          sh tools/ci_inputs.sh
          grep -qx 'tier=small' "$GITHUB_OUTPUT" || { echo "::error::the build job only builds the small tier"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          need=25  # GB: ~6.2 GB kit + same again for the zip + downloads in flight
          best=""; bestfree=0
          for d in /mnt "$RUNNER_TEMP"; do
            free=$(df -BG --output=avail "$d" 2>/dev/null | tail -1 | tr -dc 0-9); free=${free:-0}
            [ "$free" -gt "$bestfree" ] && { best=$d; bestfree=$free; }
          done
          df -h / /mnt || true
          [ "$bestfree" -ge "$need" ] || { echo "::error::only ${bestfree} GB free, need ${need} GB"; exit 1; }
          sudo mkdir -p "$best/kit" && sudo chown "$(id -u):$(id -g)" "$best/kit"
          echo "WORK=$best/kit" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install -q --require-hashes --only-binary :all: -r tools/requirements-build.txt
          go version

      - name: Build small kit
        id: kit
        env:
          VERSION: ${{ steps.cfg.outputs.version }}
          # The runner's Go is older than go-pmtiles needs. Pin the toolchain go fetches (checksum-verified
          # by sum.golang.org) to the version in cloudbuild.yaml's golang image, so both builders match.
          GOTOOLCHAIN: go1.25.14
        run: |
          "$WORK/venv/bin/python" tools/build_kit.py --tier small --frozen --version "$VERSION" \
            --out "$WORK/offline-toolkit-small" --cache "$WORK/cache" --zip "$WORK/offline-toolkit-small-$VERSION.zip"
          rm -rf "$WORK/cache" "$WORK/offline-toolkit-small"
          ls -la "$WORK"

      - name: Check publishability (no upload)
        id: check
        env:
          VERSION: ${{ steps.cfg.outputs.version }}
        # The bucket name is an environment variable of gcs-publish, which this job deliberately cannot
        # read; it only appears in the "target" log line. The publish job repeats this with the real one.
        run: python3 tools/publish_gcs.py --zip "$WORK/offline-toolkit-small-$VERSION.zip" --bucket checked-in-publish-job --dry-run

      - name: Hash kit zip
        id: hash
        env:
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          name="offline-toolkit-small-$VERSION.zip"
          sha=$(sha256sum "$WORK/$name" | cut -d' ' -f1)
          size=$(stat -c %s "$WORK/$name")
          echo "sha256 $sha  $name ($size bytes)"
          { echo "zip_name=$name"; echo "zip_path=$WORK/$name"; echo "sha256=$sha"; echo "size=$size"; } >> "$GITHUB_OUTPUT"

      - name: Hand the zip to the publish job
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.hash.outputs.zip_path }}
          archive: false          # upload the zip as-is (artifact name = file name); no zip-in-zip
          if-no-files-found: error
          retention-days: 1       # the minimum; approve the publish job within a day or re-run the workflow

      - name: Job summary
        if: always()
        env:
          IN_TIER: ${{ inputs.tier }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TIER: ${{ steps.cfg.outputs.tier }}
          VERSION: ${{ steps.cfg.outputs.version }}
          DRY_RUN: ${{ steps.cfg.outputs.dry_run }}
          ZIP_NAME: ${{ steps.hash.outputs.zip_name }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
          SIZE: ${{ steps.hash.outputs.size }}
          S_CFG: ${{ steps.cfg.outcome }}
          S_KIT: ${{ steps.kit.outcome }}
          S_CHECK: ${{ steps.check.outcome }}
          S_HASH: ${{ steps.hash.outcome }}
          S_UPLOAD: ${{ steps.upload.outcome }}
        run: |
          clean() { printf '%s' "$1" | tr -cd 'A-Za-z0-9._/+-'; }
          ver=$(clean "$VERSION"); [ -n "$ver" ] || ver="not resolved (input: '$(clean "$IN_VERSION")'; default: tag name on a tag push, else yyyymmdd-<commit>)"
          dry=$DRY_RUN; [ -n "$dry" ] || { [ "$EVENT" = workflow_dispatch ] && [ "$IN_DRY_RUN" = true ] && dry=true || dry=false; }
          {
            echo "## build · small kit on a GitHub runner"
            echo
            echo "| input | value |"
            echo "|---|---|"
            echo "| tier | \`$(clean "${TIER:-${IN_TIER:-small}}")\` |"
            echo "| version | \`$ver\` |"
            echo "| dry_run | \`$dry\` |"
            echo "| event | \`$(clean "$EVENT")\` |"
            echo "| ref | \`$(clean "$REF")\` |"
            echo "| commit | \`$(clean "$SHA")\` |"
            echo
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| validate inputs and manifest pins | ${S_CFG:-not run} |"
            echo "| build the small kit (--frozen) | ${S_KIT:-not run} |"
            echo "| publishability check (no upload) | ${S_CHECK:-not run} |"
            echo "| hash the zip | ${S_HASH:-not run} |"
            echo "| hand the zip to the publish job (1-day artifact) | ${S_UPLOAD:-not run} |"
            echo
            if [ -n "$ZIP_NAME" ]; then
              echo "**Kit**"
              echo
              echo "* zip: \`$(clean "$ZIP_NAME")\`"
              [ -n "$SIZE" ] && echo "* size: $(awk -v b="$(clean "$SIZE")" 'BEGIN { printf "%.2f GB (%d bytes)", b / 1e9, b }')"
              [ -n "$SHA256" ] && echo "* sha256: \`$(clean "$SHA256")\`"
              echo
            fi
            echo "This job has no Google credentials and never uploads. The \`publish\` job (gcs-publish approval)"
            if [ "$dry" = true ]; then
              echo "re-verifies the zip; this is a **dry run**, so it does **not** upload."
            else
              echo "re-verifies the zip and uploads it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------- credentials: publish small, or run Cloud Build for medium/large ----------------
  publish:
    name: "publish · ${{ inputs.tier || 'small' }} · ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && ((inputs.tier || 'small') == 'small' && 'dry run, verify zip, no upload' || 'dry run, validate inputs and pins only, no Cloud Build') || ((inputs.tier || 'small') == 'small' && 'upload to GCS' || 'build and publish on Cloud Build') }}"
    needs: build
    if: >-
      !cancelled() &&
      github.repository == 'cjrada/offline-toolkit' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.tier != 'small'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360  # GitHub's maximum; the medium/large step below gives up waiting at 350 minutes
    environment: gcs-publish
    permissions:
      contents: read
      id-token: write  # lets the auth step ask GitHub for an OIDC token; nothing else
    # Read by the summary job. All values are validated or derived from validated values; no tokens.
    outputs:
      tier: ${{ steps.cfg.outputs.tier }}
      version: ${{ steps.cfg.outputs.version }}
      dry_run: ${{ steps.cfg.outputs.dry_run }}
      published: ${{ steps.result.outputs.published }}
      zip_name: ${{ steps.result.outputs.zip_name }}
      sha256: ${{ steps.result.outputs.sha256 }}
      size: ${{ steps.result.outputs.size }}
      gs_uri: ${{ steps.result.outputs.gs_uri }}
      folder_url: ${{ steps.result.outputs.folder_url }}
      zip_url: ${{ steps.result.outputs.zip_url }}
      zip_browser_url: ${{ steps.result.outputs.zip_browser_url }}
      sha256_url: ${{ steps.result.outputs.sha256_url }}
      kit_info_url: ${{ steps.result.outputs.kit_info_url }}
      latest_url: ${{ steps.result.outputs.latest_url }}
      cloud_build_id: ${{ steps.cloudbuild.outputs.id }}
      cloud_build_url: ${{ steps.cloudbuild.outputs.url }}
      cloud_build_status: ${{ steps.cbwait.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs, build outputs and configuration
        id: cfg
        env:
          # small: take tier/version from the build job so both jobs agree (the default version has a date in it)
          IN_TIER: ${{ needs.build.outputs.tier || inputs.tier }}
          IN_VERSION: ${{ needs.build.outputs.version || inputs.version }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_DRY_RUN: ${{ needs.build.outputs.dry_run }}
          BUILD_ZIP: ${{ needs.build.outputs.zip_name }}
          BUILD_SHA256: ${{ needs.build.outputs.sha256 }}
          BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          sh tools/ci_inputs.sh
          tier=$(sed -n 's/^tier=//p' "$GITHUB_OUTPUT"); version=$(sed -n 's/^version=//p' "$GITHUB_OUTPUT")
          dry_run=$(sed -n 's/^dry_run=//p' "$GITHUB_OUTPUT")
          if [ "$tier" = small ]; then
            [ "$BUILD_RESULT" = success ] || { echo "::error::small needs a successful build job"; exit 1; }
            [ "$BUILD_DRY_RUN" = "$dry_run" ] || { echo "::error::dry_run differs between jobs"; exit 1; }
            [ "$BUILD_ZIP" = "offline-toolkit-small-$version.zip" ] || { echo "::error::unexpected zip name from build job"; exit 1; }
            echo "$BUILD_SHA256" | grep -Eqx '[0-9a-f]{64}' || { echo "::error::bad sha256 from build job"; exit 1; }
            echo "$BUILD_ARTIFACT_ID" | grep -Eqx '[0-9]{1,20}' || { echo "::error::bad artifact id from build job"; exit 1; }
          fi
          for v in GCS_BUCKET GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            eval "val=\${$v}"; [ -n "$val" ] || { echo "::error::set the $v variable on the gcs-publish environment (scripts/setup-gcp.sh prints it)"; exit 1; }
          done
          echo "$GCS_BUCKET" | grep -Eqx '[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]' || { echo "::error::bad GCS_BUCKET"; exit 1; }

      # ---------------- small: fetch and verify the build job's zip ----------------
      - name: Make a fresh download directory
        id: dir
        if: steps.cfg.outputs.tier == 'small'
        run: |
          need=10  # GB: ~6.2 GB zip
          best=""; bestfree=0
          for d in /mnt "$RUNNER_TEMP"; do
            free=$(df -BG --output=avail "$d" 2>/dev/null | tail -1 | tr -dc 0-9); free=${free:-0}
            [ "$free" -gt "$bestfree" ] && { best=$d; bestfree=$free; }
          done
          [ "$bestfree" -ge "$need" ] || { echo "::error::only ${bestfree} GB free, need ${need} GB"; exit 1; }
          dir="$best/kit-in-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo mkdir "$dir" && sudo chown "$(id -u):$(id -g)" "$dir"   # mkdir fails if it already exists
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Download kit zip from the build job
        id: download
        if: steps.cfg.outputs.tier == 'small'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ steps.dir.outputs.dir }}
          # The build job uploads the zip itself (archive: false), so it is served as application/zip and
          # download-artifact would extract it. Keep it as one file: we hash and publish the zip, not its contents.
          skip-decompress: true
          digest-mismatch: error  # the default, stated: fail if GitHub's stored digest doesn't match

      - name: Verify kit zip
        id: zip
        if: steps.cfg.outputs.tier == 'small'
        env:
          DIR: ${{ steps.dir.outputs.dir }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          VERSION: ${{ steps.cfg.outputs.version }}
        run: |
          ls -la "$DIR"
          [ "$(find "$DIR" -mindepth 1 | wc -l)" -eq 1 ] && [ -f "$DIR/$ZIP_NAME" ] && [ ! -L "$DIR/$ZIP_NAME" ] \
            || { echo "::error::expected exactly one regular file $ZIP_NAME in the artifact"; exit 1; }
          got=$(sha256sum "$DIR/$ZIP_NAME" | cut -d' ' -f1)
          [ "$got" = "$EXPECTED_SHA256" ] || { echo "::error::sha256 mismatch: build job $EXPECTED_SHA256, downloaded $got"; exit 1; }
          echo "sha256 OK: $got"
          python3 -I - "$DIR/$ZIP_NAME" "$VERSION" <<'EOF'
          import json, sys, zipfile
          zf = zipfile.ZipFile(sys.argv[1])
          names = [n for n in zf.namelist() if n.count("/") == 1 and n.endswith("/KIT-INFO.json")]
          info = json.loads(zf.read(names[0])) if len(names) == 1 else {}
          if info.get("tier") != "small" or info.get("version") != sys.argv[2]:
              sys.exit(f"KIT-INFO.json says tier={info.get('tier')!r} version={info.get('version')!r}")
          EOF
          echo "path=$DIR/$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Check publishability (no upload)
        id: check
        if: steps.cfg.outputs.tier == 'small'
        env:
          ZIP: ${{ steps.zip.outputs.path }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: python3 tools/publish_gcs.py --zip "$ZIP" --bucket "$GCS_BUCKET" --dry-run

      # ---------------- Google credentials only from here on ----------------
      - name: Authenticate to Google Cloud (keyless)
        id: auth
        if: success() && steps.cfg.outputs.dry_run != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        id: gcloud
        if: success() && steps.cfg.outputs.dry_run != 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish small kit to GCS
        id: upload
        if: success() && steps.cfg.outputs.tier == 'small' && steps.cfg.outputs.dry_run != 'true'
        env:
          ZIP: ${{ steps.zip.outputs.path }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: python3 tools/publish_gcs.py --zip "$ZIP" --bucket "$GCS_BUCKET" --auth gcloud

      # ---------------- medium / large: Cloud Build ----------------
      # Submitting and waiting are separate steps so the build id and console link are recorded (step
      # output, notice annotation) as soon as the build exists, even if the wait later fails or times out.
      - name: Submit ${{ steps.cfg.outputs.tier }} kit to Cloud Build
        id: cloudbuild
        if: success() && steps.cfg.outputs.tier != 'small' && steps.cfg.outputs.dry_run != 'true'
        env:
          TIER: ${{ steps.cfg.outputs.tier }}
          VERSION: ${{ steps.cfg.outputs.version }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          COMMIT: ${{ github.sha }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          project="${GCP_SERVICE_ACCOUNT#*@}"; project="${project%.iam.gserviceaccount.com}"
          # Check the project before submitting, so nothing after the submit can fail and lose the build id.
          echo "$project" | grep -Eqx '[a-z][a-z0-9-]{4,61}[a-z0-9]' || { echo "::error::cannot derive the project from GCP_SERVICE_ACCOUNT"; exit 1; }
          id=$(gcloud builds submit --project "$project" --no-source --config cloudbuild.yaml --async --format='value(id)' \
                 --substitutions "_TIER=$TIER,_VERSION=$VERSION,_COMMIT=$COMMIT,_BUCKET=$GCS_BUCKET")
          echo "$id" | grep -Eqx '[0-9A-Za-z-]{1,64}' || { echo "::error::unexpected Cloud Build id from gcloud"; exit 1; }
          url="https://console.cloud.google.com/cloud-build/builds/$id?project=$project"
          { echo "id=$id"; echo "project=$project"; echo "url=$url"; } >> "$GITHUB_OUTPUT"
          echo "Cloud Build $id started: $url"
          echo "::notice title=Cloud Build started for $TIER $VERSION::Cloud Build $id - $url"

      - name: Wait for Cloud Build ${{ steps.cloudbuild.outputs.id }}
        id: cbwait
        if: success() && steps.cfg.outputs.tier != 'small' && steps.cfg.outputs.dry_run != 'true'
        env:
          ID: ${{ steps.cloudbuild.outputs.id }}
          PROJECT: ${{ steps.cloudbuild.outputs.project }}
        run: |
          # The build keeps going if this job stops; a failed status query (e.g. a transient API error after
          # hours) must not fail the job, so only a final status ends the loop.
          deadline=$(( $(date +%s) + 350 * 60 )); last=""
          while :; do
            status=$(gcloud builds describe "$ID" --project "$PROJECT" --format='value(status)' 2>/dev/null) || status=UNKNOWN
            [ "$status" = "$last" ] || { echo "$(date -u +%H:%M:%S) Cloud Build $ID: $status"; last=$status; echo "status=$status" >> "$GITHUB_OUTPUT"; }
            case "$status" in
              SUCCESS) echo "Cloud Build $ID succeeded"; break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "::error::Cloud Build $ID ended with $status"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "status=STILL_RUNNING" >> "$GITHUB_OUTPUT"
              echo "::error::stopped waiting after 350 minutes; Cloud Build $ID is still running on its own. Check it with: gcloud builds describe $ID --project $PROJECT"
              exit 1
            fi
            sleep 60
          done

      # success(): only after the upload (small) or the Cloud Build wait (medium/large) succeeded. Writes links only.
      - name: Record published kit
        id: result
        if: success() && steps.cfg.outputs.dry_run != 'true'
        env:
          TIER: ${{ steps.cfg.outputs.tier }}
          VERSION: ${{ steps.cfg.outputs.version }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          BUILD_SHA256: ${{ needs.build.outputs.sha256 }}
          BUILD_SIZE: ${{ needs.build.outputs.size }}
        run: |
          zip="offline-toolkit-$TIER-$VERSION.zip"; dir="kits/$TIER/$VERSION"
          sha=$BUILD_SHA256; size=$BUILD_SIZE
          if [ "$TIER" != small ]; then
            # Best effort: the publisher may read latest.json (and only that); use it if it is this version.
            got=$(gcloud storage cat "gs://$GCS_BUCKET/kits/$TIER/latest.json" 2>/dev/null | python3 -I -c '
          import json, sys
          d = json.load(sys.stdin)
          if d.get("version") == sys.argv[1]:
              print(d.get("sha256", ""), d.get("size", ""))' "$VERSION" 2>/dev/null) || got=""
            sha=${got% *}; size=${got#* }
          fi
          echo "$sha" | grep -Eqx '[0-9a-f]{64}' || sha=""
          echo "$size" | grep -Eqx '[0-9]{1,20}' || size=""
          console="https://console.cloud.google.com/storage/browser/_details/$GCS_BUCKET"
          {
            echo "published=true"; echo "zip_name=$zip"; echo "sha256=$sha"; echo "size=$size"
            echo "gs_uri=gs://$GCS_BUCKET/$dir/$zip"
            echo "folder_url=https://console.cloud.google.com/storage/browser/$GCS_BUCKET/$dir"
            echo "zip_url=$console/$dir/$zip"
            echo "zip_browser_url=https://storage.cloud.google.com/$GCS_BUCKET/$dir/$zip"
            echo "sha256_url=$console/$dir/$zip.sha256"
            echo "kit_info_url=$console/$dir/KIT-INFO.json"
            echo "latest_url=$console/kits/$TIER/latest.json"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Published $TIER kit $VERSION (private bucket - sign in to Google to download)::gs://$GCS_BUCKET/$dir/$zip - $console/$dir/$zip"

      - name: Dry run summary
        if: steps.cfg.outputs.dry_run == 'true'
        env:
          TIER: ${{ steps.cfg.outputs.tier }}
        run: echo "Dry run for $TIER - nothing uploaded. Medium/large dry runs only validate inputs and pins."

      - name: Job summary
        if: always()
        env:
          IN_TIER: ${{ inputs.tier }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TIER: ${{ steps.cfg.outputs.tier }}
          VERSION: ${{ steps.cfg.outputs.version }}
          DRY_RUN: ${{ steps.cfg.outputs.dry_run }}
          ZIP_NAME: ${{ steps.result.outputs.zip_name || needs.build.outputs.zip_name }}
          SHA256: ${{ steps.result.outputs.sha256 || needs.build.outputs.sha256 }}
          SIZE: ${{ steps.result.outputs.size || needs.build.outputs.size }}
          GS_URI: ${{ steps.result.outputs.gs_uri }}
          FOLDER_URL: ${{ steps.result.outputs.folder_url }}
          ZIP_URL: ${{ steps.result.outputs.zip_url }}
          ZIP_BROWSER_URL: ${{ steps.result.outputs.zip_browser_url }}
          SHA256_URL: ${{ steps.result.outputs.sha256_url }}
          KIT_INFO_URL: ${{ steps.result.outputs.kit_info_url }}
          LATEST_URL: ${{ steps.result.outputs.latest_url }}
          CB_ID: ${{ steps.cloudbuild.outputs.id }}
          CB_URL: ${{ steps.cloudbuild.outputs.url }}
          CB_STATUS: ${{ steps.cbwait.outputs.status }}
          S_CFG: ${{ steps.cfg.outcome }}
          S_DOWNLOAD: ${{ steps.download.outcome }}
          S_VERIFY: ${{ steps.zip.outcome }}
          S_CHECK: ${{ steps.check.outcome }}
          S_AUTH: ${{ steps.auth.outcome }}
          S_UPLOAD: ${{ steps.upload.outcome }}
          S_CB: ${{ steps.cloudbuild.outcome }}
          S_CBWAIT: ${{ steps.cbwait.outcome }}
        run: |
          clean() { printf '%s' "$1" | tr -cd 'A-Za-z0-9._/+-'; }
          tier=$(clean "${TIER:-${IN_TIER:-small}}")
          ver=$(clean "$VERSION"); [ -n "$ver" ] || ver="not resolved (input: '$(clean "$IN_VERSION")'; default: tag name on a tag push, else yyyymmdd-<commit>)"
          dry=$DRY_RUN; [ -n "$dry" ] || { [ "$EVENT" = workflow_dispatch ] && [ "$IN_DRY_RUN" = true ] && dry=true || dry=false; }
          row() { [ -n "$2" ] && [ "$2" != skipped ] && echo "| $1 | $2 |"; return 0; }
          {
            if [ "$dry" = true ]; then echo "## publish · $tier · dry run"; else echo "## publish · $tier · publish"; fi
            echo
            echo "| input | value |"
            echo "|---|---|"
            echo "| tier | \`$tier\` |"
            echo "| version | \`$ver\` |"
            echo "| dry_run | \`$dry\` |"
            echo "| event | \`$(clean "$EVENT")\` |"
            echo "| ref | \`$(clean "$REF")\` |"
            echo "| commit | \`$(clean "$SHA")\` |"
            echo
            echo "| step | outcome |"
            echo "|---|---|"
            row "validate inputs, manifest pins and gcs-publish configuration" "${S_CFG:-not run}"
            row "download the build job's zip" "$S_DOWNLOAD"
            row "verify sha256 and KIT-INFO.json" "$S_VERIFY"
            row "publishability check with the real bucket (no upload)" "$S_CHECK"
            row "authenticate to Google Cloud (keyless)" "$S_AUTH"
            row "upload small kit to GCS" "$S_UPLOAD"
            row "submit to Cloud Build" "$S_CB"
            row "wait for Cloud Build" "$S_CBWAIT${CB_STATUS:+ ($(clean "$CB_STATUS"))}"
            echo
            if [ "$dry" = true ] && [ "$tier" = small ]; then
              echo "**Dry run:** the small kit was built by the \`build\` job and verified and checked here. **Nothing was uploaded.**"
            elif [ "$dry" = true ]; then
              echo "**Dry run:** for $tier this only validates the inputs, the manifest pins and the gcs-publish configuration."
              echo "**Cloud Build was not started; no kit was built and nothing was uploaded.** Untick dry_run to build and publish."
            fi
            if [ -n "$ZIP_NAME" ]; then
              echo
              echo "**Kit**"
              echo
              echo "* zip: \`$(clean "$ZIP_NAME")\`"
              [ -n "$SIZE" ] && echo "* size: $(awk -v b="$(clean "$SIZE")" 'BEGIN { printf "%.2f GB (%d bytes)", b / 1e9, b }')"
              [ -n "$SHA256" ] && echo "* sha256: \`$(clean "$SHA256")\`"
            fi
            if [ -n "$CB_ID" ]; then
              echo
              echo "**Cloud Build:** [\`$(clean "$CB_ID")\`]($CB_URL) status: ${CB_STATUS:-unknown}"
              [ "$CB_STATUS" = SUCCESS ] || echo "  The build runs on its own even if this job stopped waiting; check the link above."
            fi
            if [ -n "$GS_URI" ]; then
              echo
              echo "### Published"
              echo
              echo "\`$GS_URI\`"
              echo
              echo "The bucket is **private**: these links need a Google account with access to it."
              echo "Unauthenticated storage.googleapis.com URLs do not work."
              echo
              echo "* zip: [console]($ZIP_URL) · [download (signed-in browser)]($ZIP_BROWSER_URL)"
              echo "* [sha256 sidecar]($SHA256_URL)"
              echo "* [KIT-INFO.json]($KIT_INFO_URL)"
              echo "* [latest.json]($LATEST_URL) (kits/$tier/latest.json now points at this version)"
              echo "* [version folder]($FOLDER_URL)"
            elif [ "$dry" != true ]; then
              echo
              echo "**Nothing was published** by this job (see the step outcomes above)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------- one overall report, whatever happened above ----------------
  # Runs even when build/publish were skipped (refs other than main / v*), failed or were cancelled.
  # No environment, no permissions, no secrets, no checkout: only job outputs and the github context.
  summary:
    name: "summary · ${{ inputs.tier || 'small' }} · ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'dry run' || 'publish' }}"
    needs: [build, publish]
    if: always() && github.repository == 'cjrada/offline-toolkit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Run summary
        env:
          IN_TIER: ${{ inputs.tier }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          TIER: ${{ needs.publish.outputs.tier || needs.build.outputs.tier }}
          VERSION: ${{ needs.publish.outputs.version || needs.build.outputs.version }}
          DRY_RUN: ${{ needs.publish.outputs.dry_run || needs.build.outputs.dry_run }}
          ZIP_NAME: ${{ needs.publish.outputs.zip_name || needs.build.outputs.zip_name }}
          SHA256: ${{ needs.publish.outputs.sha256 || needs.build.outputs.sha256 }}
          SIZE: ${{ needs.publish.outputs.size || needs.build.outputs.size }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
          GS_URI: ${{ needs.publish.outputs.gs_uri }}
          FOLDER_URL: ${{ needs.publish.outputs.folder_url }}
          ZIP_URL: ${{ needs.publish.outputs.zip_url }}
          ZIP_BROWSER_URL: ${{ needs.publish.outputs.zip_browser_url }}
          SHA256_URL: ${{ needs.publish.outputs.sha256_url }}
          KIT_INFO_URL: ${{ needs.publish.outputs.kit_info_url }}
          LATEST_URL: ${{ needs.publish.outputs.latest_url }}
          CB_ID: ${{ needs.publish.outputs.cloud_build_id }}
          CB_URL: ${{ needs.publish.outputs.cloud_build_url }}
          CB_STATUS: ${{ needs.publish.outputs.cloud_build_status }}
        run: |
          clean() { printf '%s' "$1" | tr -cd 'A-Za-z0-9._/+-'; }
          url() { printf '%s' "$1" | grep -Eqx 'https://[A-Za-z0-9._/?=&%+-]+' && printf '%s' "$1"; return 0; }
          tier=$(clean "${TIER:-${IN_TIER:-small}}"); ref=$(clean "$REF")
          ver=$(clean "$VERSION"); [ -n "$ver" ] || ver="not resolved (input: '$(clean "$IN_VERSION")'; default: tag name on a tag push, else yyyymmdd-<commit>)"
          dry=$DRY_RUN; [ -n "$dry" ] || { [ "$EVENT" = workflow_dispatch ] && [ "$IN_DRY_RUN" = true ] && dry=true || dry=false; }
          case "$ref" in refs/heads/main|refs/tags/v*) allowed=true ;; *) allowed=false ;; esac
          cb_link=$(url "$CB_URL"); zip_link=$(url "$ZIP_URL")

          if [ "$allowed" != true ]; then
            head="Skipped: $ref is not main or a v* tag, so build and publish did not run"
            more="publish-kit only builds and publishes from \`refs/heads/main\` or a \`v*\` tag. Run it again with **Use workflow from: main**."
          elif [ "$BUILD_RESULT" = failure ] || [ "$BUILD_RESULT" = cancelled ]; then
            head="Build $BUILD_RESULT: nothing was published"
            more="The small kit could not be built on the runner, so the publish job did not run. See the build job's log."
          elif [ "$PUBLISH_RESULT" = success ] && [ "$dry" = true ] && [ "$tier" = small ]; then
            head="Dry run OK: small kit built and verified, nothing uploaded"
            more="Both jobs ran, the zip was handed over and checked against the real bucket, but no upload was made. Untick dry_run to publish."
          elif [ "$PUBLISH_RESULT" = success ] && [ "$dry" = true ]; then
            head="Dry run OK: $tier inputs and pins validated only; Cloud Build was not started"
            more="A $tier dry run validates the inputs, the manifest pins and the gcs-publish configuration. **No kit was built and nothing was uploaded.** Untick dry_run to build and publish on Cloud Build."
          elif [ "$PUBLISH_RESULT" = success ] && [ "$PUBLISHED" = true ]; then
            head="Published $tier kit $ver"
            more="Uploaded to the private bucket; links below."
          elif [ "$PUBLISH_RESULT" = failure ] || [ "$PUBLISH_RESULT" = cancelled ]; then
            head="Publish job $PUBLISH_RESULT"
            more="See the publish job's log. If the gcs-publish approval was rejected, the job never started."
            [ -n "$CB_ID" ] && more="$more Cloud Build \`$(clean "$CB_ID")\` was submitted (status: ${CB_STATUS:-unknown}) and keeps running on its own; check it in the console."
          else
            head="Publish job: ${PUBLISH_RESULT:-not run}"
            more="The publish job did not report a published kit."
          fi
          {
            echo "# publish-kit: $head"
            echo
            echo "$more"
            echo
            echo "| input | value |"
            echo "|---|---|"
            echo "| tier | \`$tier\` |"
            echo "| version | \`$ver\` |"
            echo "| dry_run | \`$dry\` |"
            echo "| event | \`$(clean "$EVENT")\` |"
            echo "| ref | \`$ref\` |"
            echo "| commit | \`$(clean "$SHA")\` |"
            echo "| started by | \`$(clean "$ACTOR")\` |"
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "| build (small kit on a GitHub runner) | ${BUILD_RESULT:-unknown} |"
            echo "| publish (gcs-publish environment) | ${PUBLISH_RESULT:-unknown} |"
            if [ "$BUILD_RESULT" = skipped ] && [ "$allowed" = true ] && [ "$tier" != small ]; then
              echo
              echo "build is skipped for $tier on purpose: medium and large are built on Cloud Build by the publish job."
            fi
            if [ -n "$ZIP_NAME" ]; then
              echo
              echo "**Kit**"
              echo
              echo "* zip: \`$(clean "$ZIP_NAME")\`"
              [ -n "$SIZE" ] && echo "* size: $(awk -v b="$(clean "$SIZE")" 'BEGIN { printf "%.2f GB (%d bytes)", b / 1e9, b }')"
              [ -n "$SHA256" ] && echo "* sha256: \`$(clean "$SHA256")\`"
            fi
            if [ -n "$CB_ID" ]; then
              echo
              echo "**Cloud Build:** [\`$(clean "$CB_ID")\`]($cb_link) status: $(clean "${CB_STATUS:-unknown}")"
            fi
            if [ -n "$GS_URI" ]; then
              echo
              echo "## Published kit"
              echo
              echo "\`$(printf '%s' "$GS_URI" | grep -Ex 'gs://[a-z0-9._-]+/[A-Za-z0-9._/-]+')\`"
              echo
              echo "The bucket is **private** (public access prevention): open these signed in with a Google account"
              echo "that has access. Plain storage.googleapis.com URLs return an error without credentials."
              echo
              echo "* zip: [console]($zip_link) · [download (signed-in browser)]($(url "$ZIP_BROWSER_URL"))"
              echo "* [sha256 sidecar]($(url "$SHA256_URL"))"
              echo "* [KIT-INFO.json]($(url "$KIT_INFO_URL"))"
              echo "* [latest.json]($(url "$LATEST_URL"))"
              echo "* [version folder]($(url "$FOLDER_URL"))"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          link=""; [ -n "$zip_link" ] && link=" - $zip_link"; [ -z "$link" ] && [ -n "$cb_link" ] && link=" - Cloud Build $cb_link"
          echo "::notice title=publish-kit result ($tier)::$head$link"
