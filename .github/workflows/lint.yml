name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S warning start.sh stop.sh tools/*.sh tests/*.sh
      - name: python syntax
        run: python3 -m py_compile tools/*.py tests/*.py
      - name: model auto-selection tests
        run: sh tests/test_pick_model.sh
      - name: build-kit and publisher tests (offline)
        run: |
          python3 tests/test_build_kit.py
          python3 tests/test_publish_gcs.py
      - name: manifest pin status
        run: python3 tools/build_kit.py --check --tier large
