name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S warning start.sh stop.sh tools/*.sh tests/*.sh scripts/*.sh
      - name: python syntax
        run: python3 -m py_compile tools/*.py tests/*.py
      - name: setup-gcp static checks (explicit IAM conditions, no prompts)
        run: python3 tests/test_setup_gcp.py
      - name: publish-kit and pages workflow static checks (zip hand-off, gating, secrets, run summary)
        run: python3 tests/test_publish_workflow.py
      - name: cloudbuild.yaml static checks (pinned images, upload python, Secret Manager, cache steps)
        run: python3 tests/test_cloudbuild.py
      - name: R2 publisher and retention (fake S3, offline)
        run: python3 tests/test_publish_r2.py
      - name: downloads page generator (offline)
        run: python3 tests/test_build_site.py
      - name: GCS download cache and cloud-sdk python wrapper (stub gcloud)
        run: sh tests/test_gcs_cache.sh
      - name: model auto-selection tests (sh and PowerShell)
        run: |
          sh tests/test_pick_model.sh
          sh tests/test_pick_model_ps1.sh
      - name: launcher GPU workarounds, CPU fallback and CPU-only toggle (stub llamafile)
        run: sh tests/test_cpu_fallback.sh
      - name: start.bat / stop.bat static checks (Windows launcher in step with start.sh)
        run: python3 tests/test_start_bat.py
      - name: stop.sh stops only this kit (stub servers, PID files, /tmp binary copy)
        run: sh tests/test_stop.sh
      - name: kit pages (node, offline) - safe markdown, manuals retrieval and prompt, AI notice, chat page
        run: node tests/test_kit_js.mjs
      - name: LLM reliability eval harness (node, offline) - cases file, checks, stub AI server, retrieval on the notes
        run: node tests/test_llm_eval.mjs
      - name: build dependency (libzim, hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes --only-binary ':all:' -r tools/requirements-build.txt
      - name: build-kit and GCS publisher tests (offline)
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/test_build_kit.py
          "$RUNNER_TEMP/venv/bin/python" tests/test_publish_gcs.py
      - name: manifest pin status
        run: python3 tools/build_kit.py --check --frozen --tier large
